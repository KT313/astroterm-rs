# Optional runtime policies. Copy to ~/.config/astroterm/cache.toml on Linux,
# or select explicitly with --cache-config examples/cache.toml.
# --disable-cache overrides enabled and all groups. The startup catalog file cache is unaffected.
version = 1
enabled = true

# Absolute simulated seconds on either side of an evaluation epoch, never wall-clock TTLs.
# These are the current upper limits. Shorter values are accepted; zero reuses only exactly matching simulation times.
# Set enabled=false (or use --disable-cache) to disable reuse, including paused frames.
# The complete solar-system group refreshes whenever simulation time or observer location changes.
# Its sample spans below apply within one reception/emission preparation request.
# Stellar regions hold direction and magnitude for up to 10 simulated days. This is a fixed
# approximation, not an accuracy-qualified interval; use a shorter age or --disable-cache for fresh values.
[groups.stellar_state]
enabled = true
max_age_seconds = 864000
[groups.planetary_samples]
enabled = true
max_age_seconds = 30
[groups.lunar_samples]
enabled = true
max_age_seconds = 12
[groups.slow_orientation]
enabled = true
max_age_seconds = 60

# Remaining groups have dependency-driven reuse. They accept enabled only, not a TTL.
# Observer and emission states depend on the requested time even while samples remain valid.
[groups.observer_state]
enabled = true
[groups.solar_system_observation]
enabled = true

# Region + brightness bounds; candidate validation + endpoint union; current brightness eligibility and correction selection.
[groups.candidate_selection]
enabled = true
[groups.working_set]
enabled = true
[groups.stellar_visibility]
enabled = true

# Each correction has its own result. Changing a result invalidates its dependents.
[groups.solar_system_geometry]
enabled = true
[groups.apparent_directions]
enabled = true
[groups.horizontal_sky]
enabled = true
[groups.refraction]
enabled = true

# Separate star/body/constellation geometry, sorting, and horizon geometry.
[groups.projection]
enabled = true
[groups.draw_order]
enabled = true
[groups.view_geometry]
enabled = true

# Whole-sky bitmap or character canvas; glyph masks. Current metadata is composed afterward.
[groups.raster]
enabled = true
[groups.raster_assets]
enabled = true
