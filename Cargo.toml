[package]
name = "astroterm-rs"
version = "0.1.0"
edition = "2024"
description = "A terminal-based star map (Rust port of astroterm)"
license = "MIT"

[lib]
name = "astroterm"
path = "src/lib.rs"

[[bin]]
name = "astroterm"
path = "src/main.rs"

[features]
default = []
memory-diagnostics = []

[[test]]
name = "memory_inventory"
path = "tests/memory_inventory.rs"
required-features = ["memory-diagnostics"]

[[test]]
name = "memory_trace"
path = "tests/memory_trace.rs"
required-features = ["memory-diagnostics"]

[dependencies]
base64-simd = "0.8"
bytemuck = "1.25.2"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crc32fast = "1.5.2"
crossterm = "0.29.0"
csv = "1.4.0"
dirs = "7.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
fontdue = "0.9.4"
image = { version = "0.25", default-features = false }
memmap2 = "0.9.11"
ndarray = "0.17"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
soa_derive = "0.14"
strsim = "0.11.1"
tempfile = "3.27.0"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
toml = "0.9"
tzf-rs = { version = "2.1.2", default-features = false, features = ["bundled"] }
unicode-width = "0.2.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
vsop87 = "3.0.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["event"] }
tz-rs = "0.7.3"

[dev-dependencies]
trybuild = "1"
insta = "1"
proptest = "1"
criterion = "0.7"
serde_json = "1"

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "spatial"
harness = false

# `make build-aggressive`: the release profile plus whole-program optimization and `-C target-cpu=native`.
# `make build-aggressive-pgo` additionally trains/applies PGO and BOLT. Panics abort, but the panic hook still
# restores the terminal first.
[profile.aggressive]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
