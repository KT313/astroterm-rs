[package]
name = "astroterm-rs"
version = "0.1.0"
edition = "2024"
description = "A terminal-based star map (Rust port of astroterm)"
license = "MIT"

[lib]
name = "astroterm"
path = "src/lib.rs"

[[bin]]
name = "astroterm"
path = "src/main.rs"

[dependencies]
bytemuck = "1.25.2"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crc32fast = "1.5.2"
crossterm = "0.29.0"
csv = "1.4.0"
dirs = "7.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
memmap2 = "0.9.11"
sha2 = "0.11.0"
strsim = "0.11.1"
tempfile = "3.27.0"
tzf-rs = { version = "2.1.2", default-features = false, features = ["bundled"] }
unicode-width = "0.2.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
tz-rs = "0.7.3"

[dev-dependencies]
insta = "1"
proptest = "1"
criterion = "0.7"
serde_json = "1"

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "spatial"
harness = false

# `make build-aggressive`: the release profile plus whole-program optimization. On top of this, the Makefile adds
# `-C target-cpu=native`, PGO and BOLT. None of it changes behavior; panics abort, but the panic hook still restores
# the terminal first.
[profile.aggressive]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
