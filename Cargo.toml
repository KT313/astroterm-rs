[package]
name = "astroterm-rs"
version = "0.1.0"
edition = "2024"
description = "A terminal-based star map (Rust port of astroterm)"
license = "MIT"

[lib]
name = "astroterm"
path = "src/lib.rs"

[[bin]]
name = "astroterm"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossterm = "0.29.0"
csv = "1.4.0"
flate2 = "1.1.10"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
tz-rs = "0.7.3"

# `make build-aggressive`: the release profile plus whole-program optimization. On top of this, the Makefile adds
# `-C target-cpu=native`, PGO and BOLT. None of it changes behavior; panics abort, but the panic hook still restores
# the terminal first.
[profile.aggressive]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
